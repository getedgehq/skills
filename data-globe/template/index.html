<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Data Globe</title><link rel="icon" href="data:,"><link rel="stylesheet" href="vendor/maplibre-gl.css"><link rel="stylesheet" href="style.css"></head><body>
<div id="stars" aria-hidden="true"></div><div id="atmosphere" aria-hidden="true"><div id="bloom"></div><div id="rim"></div></div><div id="map" aria-label="Interactive location globe"></div><div id="markers"></div><div id="cluster"></div>
<section id="controls" class="glass" aria-label="Globe filters"><header><span class="eyebrow">A WORLD OF LOCATIONS</span><h1 id="title">Data Globe</h1><p id="status" role="status">Loading locations…</p></header><label>Find a location<input id="search" type="search" placeholder="Name, city or country"></label><div id="results" hidden></div><button id="toggle-filters" aria-expanded="false">Filters +</button><div id="filter-body"><label>Category<select id="category"><option value="">All categories</option></select></label><div id="chips"></div><p id="notice"></p></div><div class="buttons"><button id="reset">Reset view</button><button id="share">Copy link</button><button id="theme" aria-label="Toggle land appearance">Dark land</button></div><footer><span id="source"></span><p>Drag to explore · Select a location to look closer</p></footer></section>
<div id="summary"><section class="glass"><h3>Where it concentrates</h3><div id="ranking"></div></section><section class="glass"><h3>In view <small id="view-count"></small></h3><div id="wall"></div></section></div>
<section id="time" class="glass" hidden aria-label="Date filter"><div><span class="eyebrow">SOURCE DATES</span><small>Undated rows excluded during a brush.</small></div><svg id="histogram" viewBox="0 0 240 36" aria-label="Dated entity histogram"></svg><label>From <output id="from-label"></output><input id="from" type="range" min="0" value="0"></label><label>Through <output id="to-label"></output><input id="to" type="range" min="0" value="0"></label></section>
<aside id="detail" class="glass" hidden aria-label="Location details"><nav><button id="back" hidden>← All entities</button><button id="close" aria-label="Close details">×</button></nav><span class="eyebrow" id="grouping"></span><h2 id="detail-title" tabindex="-1"></h2><p id="detail-count"></p><div id="entity-info" hidden></div><div id="entities"></div><button id="more" hidden>Show more</button></aside>
<div id="loading" class="glass" role="status" hidden>Loading streets and labels…</div><div id="hover" hidden></div><script src="vendor/maplibre-gl.js"></script><script type="module" src="app.js"></script></body></html>
