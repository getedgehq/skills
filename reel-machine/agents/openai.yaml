interface:
  display_name: "Reel Machine"
  short_description: "Raw phone clips to scheduled Instagram Reels, TikToks and YouTube Shorts, with sync, sensitivity and caption checks"
  default_prompt: "Turn my clip from today into a reel: transcribe it, pick the strongest segment, write a 2-line hook, render it, run the lip-sync, sensitivity and caption checks, and create Buffer drafts for tomorrow at noon. Do not arm anything."
