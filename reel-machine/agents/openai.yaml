interface:
  display_name: "Reel Machine"
  short_description: "Raw phone clips to finished, free Instagram Reels, TikToks and YouTube Shorts, with natural voice, jump cuts, pace, face, sync, sensitivity and caption checks"
  default_prompt: "Turn my clip from today into a reel: transcribe it, pick the strongest segment, write a 2-line hook, render it, run finish.sh (voice, jump cuts, pace gate, face check) and the lip-sync, sensitivity and caption checks, and hand me the finished 9:16 file with its caption (Buffer drafts for tomorrow at noon only if a Buffer token is set). Do not arm anything."
