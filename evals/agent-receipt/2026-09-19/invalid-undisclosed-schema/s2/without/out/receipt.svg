<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Proof-of-work receipt for Checkout recovery</title>
  <desc id="desc">A summary-only public receipt showing work metrics, verification status, and cryptographic evidence references without private evidence.</desc>
  <rect width="1200" height="675" fill="#0b1020"/>
  <rect x="54" y="50" width="1092" height="575" rx="26" fill="#111a31" stroke="#2b3a61" stroke-width="2"/>
  <circle cx="94" cy="94" r="10" fill="#65e6b4"/>
  <text x="120" y="104" fill="#9eafd4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" letter-spacing="2">PUBLIC PROOF-OF-WORK RECEIPT</text>
  <text x="82" y="174" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700">Checkout recovery</text>
  <text x="84" y="211" fill="#9eafd4" font-family="Inter, Arial, sans-serif" font-size="22">Agent: Codex</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="82" y="250" width="240" height="120" rx="16" fill="#182441"/>
    <text x="104" y="286" fill="#9eafd4" font-size="18">DURATION</text>
    <text x="104" y="338" fill="#ffffff" font-size="38" font-weight="700">18.5 min</text>

    <rect x="342" y="250" width="240" height="120" rx="16" fill="#182441"/>
    <text x="364" y="286" fill="#9eafd4" font-size="18">INTERVENTIONS</text>
    <text x="364" y="338" fill="#ffffff" font-size="38" font-weight="700">2</text>

    <rect x="602" y="250" width="240" height="120" rx="16" fill="#182441"/>
    <text x="624" y="286" fill="#9eafd4" font-size="18">FILES CHANGED</text>
    <text x="624" y="338" fill="#ffffff" font-size="38" font-weight="700">7</text>

    <rect x="862" y="250" width="256" height="120" rx="16" fill="#182441"/>
    <text x="884" y="286" fill="#9eafd4" font-size="18">TESTS</text>
    <text x="884" y="338" fill="#65e6b4" font-size="38" font-weight="700">14 / 14</text>

    <text x="84" y="424" fill="#9eafd4" font-size="18">VERIFICATION</text>
    <text x="84" y="458" fill="#ffffff" font-size="23">Targeted tests and browser smoke check passed</text>
    <text x="84" y="505" fill="#9eafd4" font-size="18">DEPLOYMENT</text>
    <text x="84" y="539" fill="#ffffff" font-size="23">unknown</text>

    <rect x="730" y="407" width="388" height="142" rx="16" fill="#0e162b" stroke="#2b3a61"/>
    <text x="754" y="441" fill="#9eafd4" font-size="17">EVIDENCE REFERENCES</text>
    <text x="754" y="477" fill="#ffffff" font-size="23" font-weight="700">2 SHA-256 digests</text>
    <text x="754" y="514" fill="#65e6b4" font-size="17">PRIVATE VALUES OMITTED</text>
  </g>

  <line x1="82" y1="574" x2="1118" y2="574" stroke="#2b3a61"/>
  <text x="84" y="605" fill="#7f91b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">MANIFEST SHA-256  a6d19a6d1b890632...09f854a</text>
  <text x="1118" y="605" fill="#65e6b4" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="end">SUMMARY-ONLY</text>
</svg>
