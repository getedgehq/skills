<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Proof-of-work receipt for Checkout recovery</title>
  <desc id="description">Public-safe summary-only receipt showing agent, duration, interventions, changed files, tests, verification, deployment status, skills, and cryptographic evidence references.</desc>
  <rect width="1200" height="675" fill="#0b1220"/>
  <rect x="48" y="42" width="1104" height="591" rx="24" fill="#111b2e" stroke="#2b3c58" stroke-width="2"/>

  <text x="88" y="92" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">PROOF OF WORK · SUMMARY-ONLY</text>
  <text x="88" y="145" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Checkout recovery</text>
  <text x="88" y="181" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="19">Public-safe receipt · Agent: Codex</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="88" y="222" width="230" height="112" rx="16" fill="#17243a"/>
    <text x="108" y="254" fill="#94a3b8" font-size="16">DURATION</text>
    <text x="108" y="305" fill="#f8fafc" font-size="36" font-weight="700">18.5 min</text>

    <rect x="334" y="222" width="230" height="112" rx="16" fill="#17243a"/>
    <text x="354" y="254" fill="#94a3b8" font-size="16">INTERVENTIONS</text>
    <text x="354" y="305" fill="#f8fafc" font-size="36" font-weight="700">2</text>

    <rect x="580" y="222" width="230" height="112" rx="16" fill="#17243a"/>
    <text x="600" y="254" fill="#94a3b8" font-size="16">FILES CHANGED</text>
    <text x="600" y="305" fill="#f8fafc" font-size="36" font-weight="700">7</text>

    <rect x="826" y="222" width="286" height="112" rx="16" fill="#153529" stroke="#286149"/>
    <text x="846" y="254" fill="#86efac" font-size="16">TESTS</text>
    <text x="846" y="305" fill="#f0fdf4" font-size="36" font-weight="700">14 / 14 passed</text>

    <text x="88" y="387" fill="#94a3b8" font-size="16">VERIFICATION</text>
    <text x="88" y="420" fill="#e2e8f0" font-size="21">Targeted tests and browser smoke check passed</text>

    <text x="88" y="467" fill="#94a3b8" font-size="16">DEPLOYMENT</text>
    <text x="88" y="499" fill="#fbbf24" font-size="21" font-weight="600">Unknown</text>

    <text x="334" y="467" fill="#94a3b8" font-size="16">SKILLS</text>
    <text x="334" y="499" fill="#e2e8f0" font-size="20">workplan · localhost-ui-fix-loop</text>

    <line x1="88" y1="539" x2="1112" y2="539" stroke="#2b3c58"/>
    <text x="88" y="575" fill="#94a3b8" font-size="16">EVIDENCE REFERENCES</text>
    <text x="88" y="605" fill="#cbd5e1" font-size="18">2 SHA-256 digests · Full-manifest SHA-256 recorded in receipt.json</text>
    <text x="1112" y="605" fill="#7dd3fc" font-size="16" text-anchor="end">NO PRIVATE EVIDENCE INCLUDED</text>
  </g>
</svg>
