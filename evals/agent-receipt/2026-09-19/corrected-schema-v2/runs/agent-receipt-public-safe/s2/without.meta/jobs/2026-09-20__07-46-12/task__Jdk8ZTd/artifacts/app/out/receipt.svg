<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Proof-of-work receipt</title>
  <desc id="desc">Public-safe summary of a verified Codex work run.</desc>
  <rect width="1200" height="675" fill="#0b1020"/>
  <rect x="64" y="56" width="1072" height="563" rx="28" fill="#121a2e" stroke="#2c3b60" stroke-width="2"/>
  <circle cx="101" cy="101" r="13" fill="#62d9a7"/>
  <text x="130" y="111" fill="#9fb0d0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">EDGE AGENT RECEIPT · 1.0</text>
  <text x="92" y="190" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700">Checkout recovery</text>
  <text x="94" y="229" fill="#9fb0d0" font-family="Inter, Arial, sans-serif" font-size="22">Proof of work · summary only</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="92" y="278" width="240" height="132" rx="18" fill="#19243d"/>
    <text x="116" y="316" fill="#8fa3c7" font-size="18">DURATION</text>
    <text x="116" y="371" fill="#ffffff" font-size="42" font-weight="700">18.5 min</text>

    <rect x="354" y="278" width="240" height="132" rx="18" fill="#19243d"/>
    <text x="378" y="316" fill="#8fa3c7" font-size="18">FILES CHANGED</text>
    <text x="378" y="371" fill="#ffffff" font-size="42" font-weight="700">7</text>

    <rect x="616" y="278" width="240" height="132" rx="18" fill="#19243d"/>
    <text x="640" y="316" fill="#8fa3c7" font-size="18">TESTS PASSED</text>
    <text x="640" y="371" fill="#62d9a7" font-size="42" font-weight="700">14 / 14</text>

    <rect x="878" y="278" width="230" height="132" rx="18" fill="#19243d"/>
    <text x="902" y="316" fill="#8fa3c7" font-size="18">INTERVENTIONS</text>
    <text x="902" y="371" fill="#ffffff" font-size="42" font-weight="700">2</text>

    <text x="94" y="465" fill="#8fa3c7" font-size="18">VERIFICATION</text>
    <text x="94" y="500" fill="#e5ebf7" font-size="24">Targeted tests and browser smoke check passed</text>

    <line x1="94" y1="536" x2="1106" y2="536" stroke="#2c3b60"/>
    <text x="94" y="578" fill="#9fb0d0" font-size="19">Agent: Codex</text>
    <text x="319" y="578" fill="#9fb0d0" font-size="19">Evidence digests: 2</text>
    <text x="599" y="578" fill="#9fb0d0" font-size="19">Deployment: unknown</text>
    <text x="889" y="578" fill="#62d9a7" font-size="19">Demo: false</text>
  </g>
</svg>
