<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Proof-of-work receipt for Checkout recovery</title>
  <desc id="desc">Public summary of an agent run with verification results and privacy-safe evidence attestations.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
  <circle cx="1065" cy="80" r="185" fill="#22d3ee" opacity="0.06"/>
  <circle cx="110" cy="650" r="230" fill="#818cf8" opacity="0.06"/>
  <rect x="60" y="54" width="1080" height="567" rx="28" fill="#0f172a" stroke="#334155" filter="url(#shadow)"/>
  <rect x="60" y="54" width="8" height="567" rx="4" fill="url(#accent)"/>

  <text x="104" y="110" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">EDGE AGENT · PROOF OF WORK</text>
  <text x="104" y="165" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="700">Checkout recovery</text>
  <text x="104" y="202" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">Completed by Codex · 18.5 minutes · 2 interventions</text>

  <rect x="104" y="242" width="296" height="144" rx="18" fill="#111c31" stroke="#334155"/>
  <text x="128" y="278" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">TESTS</text>
  <text x="128" y="337" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="50" font-weight="700">14 / 14</text>
  <circle cx="368" cy="270" r="9" fill="#34d399"/>
  <text x="128" y="368" fill="#6ee7b7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">All passed</text>

  <rect x="420" y="242" width="296" height="144" rx="18" fill="#111c31" stroke="#334155"/>
  <text x="444" y="278" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">FILES CHANGED</text>
  <text x="444" y="337" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="50" font-weight="700">7</text>
  <text x="444" y="368" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Recorded in manifest</text>

  <rect x="736" y="242" width="360" height="144" rx="18" fill="#111c31" stroke="#334155"/>
  <text x="760" y="278" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">EVIDENCE</text>
  <text x="760" y="337" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="50" font-weight="700">2 attestations</text>
  <text x="760" y="368" fill="#c4b5fd" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Digest-only · source details withheld</text>

  <text x="104" y="440" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">VERIFICATION</text>
  <text x="104" y="476" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">targeted tests and browser smoke check passed</text>
  <line x1="104" y1="507" x2="1096" y2="507" stroke="#334155"/>

  <text x="104" y="548" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">DEPLOYMENT</text>
  <text x="104" y="579" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">unknown</text>
  <text x="306" y="548" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">PRIVACY</text>
  <text x="306" y="579" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">summary_only</text>
  <text x="544" y="548" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">SCHEMA</text>
  <text x="544" y="579" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">edge-agent-receipt/1.0</text>
  <rect x="959" y="542" width="137" height="40" rx="20" fill="#123a3c" stroke="#2dd4bf"/>
  <text x="1027.5" y="568" fill="#5eead4" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">DEMO: FALSE</text>
</svg>
