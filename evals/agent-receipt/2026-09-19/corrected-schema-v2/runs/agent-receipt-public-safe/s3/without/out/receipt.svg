<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Proof-of-work receipt for Checkout recovery</title>
  <desc id="desc">A public-safe summary of an agent run with verification results and cryptographic evidence references.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#17223d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="210" fill="#4de2b1" opacity=".07"/>
  <circle cx="80" cy="650" r="260" fill="#6d8cff" opacity=".08"/>
  <rect x="62" y="54" width="1076" height="567" rx="26" fill="#111a2d" stroke="#33415f" filter="url(#shadow)"/>

  <text x="104" y="108" fill="#72e6bc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">EDGE AGENT • PROOF OF WORK</text>
  <text x="104" y="166" fill="#f5f7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="43" font-weight="700">Checkout recovery</text>
  <text x="104" y="204" fill="#9ba9c4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">Completed by Codex · 18.5 minutes · 2 interventions</text>

  <rect x="104" y="244" width="300" height="132" rx="16" fill="#17243a" stroke="#2d405f"/>
  <text x="130" y="280" fill="#9ba9c4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">TESTS</text>
  <text x="130" y="339" fill="#f5f7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="700">14 / 14</text>
  <circle cx="369" cy="278" r="8" fill="#52e0a4"/>

  <rect x="426" y="244" width="300" height="132" rx="16" fill="#17243a" stroke="#2d405f"/>
  <text x="452" y="280" fill="#9ba9c4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">FILES CHANGED</text>
  <text x="452" y="339" fill="#f5f7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="700">7</text>

  <rect x="748" y="244" width="348" height="132" rx="16" fill="#17243a" stroke="#2d405f"/>
  <text x="774" y="280" fill="#9ba9c4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">DEPLOYMENT</text>
  <text x="774" y="339" fill="#f5f7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="650">UNKNOWN</text>

  <text x="104" y="430" fill="#9ba9c4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">VERIFICATION</text>
  <text x="104" y="465" fill="#e6ebf7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">targeted tests and browser smoke check passed</text>

  <line x1="104" y1="505" x2="1096" y2="505" stroke="#33415f"/>
  <text x="104" y="547" fill="#9ba9c4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">2 EVIDENCE DIGESTS · SUMMARY ONLY · DEMO FALSE</text>
  <text x="104" y="579" fill="#687894" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">schema edge-agent-receipt/1.0</text>
  <text x="1096" y="579" text-anchor="end" fill="#687894" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">MANIFEST SHA-256 VERIFIED</text>
</svg>
