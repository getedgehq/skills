<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Weekly — One useful growth idea every Friday</title>
  <meta name="description" content="A concise weekly email with one practical growth idea you can put to work.">
  <meta name="theme-color" content="#f6f1e8">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Signal Weekly">
  <meta property="og:description" content="One useful growth idea every Friday.">
  <meta property="og:image" content="social-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Signal Weekly — One useful growth idea every Friday">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><a class="brand" href="/" aria-label="Signal Weekly home">Signal Weekly</a></header>
  <main id="main">
    <section class="hero" aria-labelledby="headline">
      <p class="eyebrow">A short email for people growing useful things</p>
      <h1 id="headline">One useful growth idea every Friday.</h1>
      <p class="lede">Clear, practical, and written to be used—not saved for later.</p>
      <!-- Set action to the production subscription endpoint before launch. -->
      <form class="subscribe" id="subscribe-form" method="post" action="/subscribe" data-unconfigured novalidate>
        <label for="email">Work email</label>
        <div class="form-row">
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@company.com" required aria-describedby="email-help form-status">
          <button type="submit">Subscribe</button>
        </div>
        <p id="email-help" class="fine-print">Free. Unsubscribe anytime. Read our <a href="privacy.html">privacy policy</a>.</p>
        <p id="form-status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <footer><span>© <span id="year"></span> Signal Weekly</span><nav aria-label="Legal"><a href="privacy.html">Privacy</a></nav></footer>
  <script src="script.js" defer></script>
</body>
</html>
