<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reserve your workshop seat</title>
  <meta name="description" content="Reserve your workshop seat securely for $49."><meta name="theme-color" content="#17140f">
  <meta property="og:type" content="website"><meta property="og:title" content="Reserve your workshop seat"><meta property="og:description" content="Reserve your workshop seat securely for $49."><meta property="og:image" content="/social-preview.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="Reserve your workshop seat for $49"><meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><script src="/checkout.js" defer></script>
</head>
<body>
  <main class="shell">
    <section class="intro" aria-labelledby="page-title"><p class="eyebrow">Workshop registration</p><h1 id="page-title">Reserve your seat</h1><p class="lede">Complete your registration and join us for the workshop.</p><div class="price" aria-label="Workshop price: 49 dollars"><span>Workshop seat</span><strong>$49</strong></div></section>
    <section class="checkout-card" aria-labelledby="checkout-title">
      <h2 id="checkout-title">Checkout</h2>
      <form id="checkout" novalidate>
        <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="email-error"><p class="error" id="email-error"></p></div>
        <div class="field"><label for="card">Secure payment token</label><input id="card" name="card" type="text" autocomplete="off" required aria-describedby="card-help card-error"><p class="help" id="card-help">Use the token supplied by the secure payment form.</p><p class="error" id="card-error"></p></div>
        <div class="honeypot" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
        <label class="consent" for="terms"><input id="terms" name="terms" type="checkbox" required><span>I agree to the <a href="/terms.html">terms</a> and acknowledge the <a href="/privacy.html">privacy policy</a>.</span></label><p class="error" id="terms-error"></p>
        <button id="submit" type="submit">Pay $49</button><p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <footer><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a></footer>
</body></html>
