<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Agent capability-gap sample assessment</title>
  <desc id="desc">A generic summary card showing category ratings from a twelve-entry sample.</desc>
  <rect width="1200" height="630" fill="#0C1117"/>
  <rect x="48" y="48" width="1104" height="534" rx="28" fill="#131B24" stroke="#293646" stroke-width="2"/>
  <text x="88" y="110" fill="#8FA4B8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="2">CAPABILITY-GAP SAMPLE</text>
  <text x="88" y="164" fill="#F5F7FA" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">Measured strengths and friction</text>
  <text x="88" y="203" fill="#AAB8C6" font-family="Arial, Helvetica, sans-serif" font-size="20">12 entries · explicit friction weighted · low-volume categories withheld</text>

  <rect x="88" y="246" width="322" height="112" rx="18" fill="#1B2733"/>
  <text x="112" y="280" fill="#8FA4B8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">STRONGEST MEASURED</text>
  <text x="112" y="320" fill="#F5F7FA" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Coding</text>
  <text x="112" y="344" fill="#F4C96B" font-family="Arial, Helvetica, sans-serif" font-size="17">Developing</text>

  <rect x="429" y="246" width="322" height="112" rx="18" fill="#2A2022"/>
  <text x="453" y="280" fill="#C8A8AA" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">HIGHEST FRICTION</text>
  <text x="453" y="320" fill="#F5F7FA" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Visual design</text>
  <text x="453" y="344" fill="#FF7D86" font-family="Arial, Helvetica, sans-serif" font-size="17">Critical</text>

  <rect x="770" y="246" width="342" height="112" rx="18" fill="#252329"/>
  <text x="794" y="280" fill="#B8AEC7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">SURPRISING WEAKNESS</text>
  <text x="794" y="316" fill="#F5F7FA" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Primary-source</text>
  <text x="794" y="344" fill="#D7B7FF" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">verification</text>

  <text x="88" y="410" fill="#8FA4B8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">CATEGORY RESULTS</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18">
    <text x="88" y="454" fill="#D9E1E8">Research verification</text><text x="345" y="454" fill="#F0A66B" font-weight="700">Weak</text>
    <text x="88" y="494" fill="#D9E1E8">Spreadsheet work</text><text x="345" y="494" fill="#7F91A3" font-weight="700">Not measured</text>
    <text x="88" y="534" fill="#D9E1E8">Visual design</text><text x="345" y="534" fill="#FF7D86" font-weight="700">Critical</text>
    <text x="600" y="454" fill="#D9E1E8">Coding</text><text x="830" y="454" fill="#F4C96B" font-weight="700">Developing</text>
    <text x="600" y="494" fill="#D9E1E8">Writing</text><text x="830" y="494" fill="#7F91A3" font-weight="700">Not measured</text>
    <text x="600" y="534" fill="#D9E1E8">Tool execution</text><text x="830" y="534" fill="#7F91A3" font-weight="700">Not measured</text>
  </g>
</svg>
