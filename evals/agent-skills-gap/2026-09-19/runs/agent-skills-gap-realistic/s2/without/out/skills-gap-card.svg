<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Agent capability-gap sample results</title>
  <desc id="desc">Coding is the strongest measured category at Developing. Visual design is Critical, Research verification is Weak, and the remaining categories are Not measured.</desc>
  <rect width="1200" height="630" fill="#0B1020"/>
  <circle cx="1090" cy="-8" r="270" fill="#6D5EF7" opacity="0.16"/>
  <circle cx="106" cy="652" r="230" fill="#20C9A6" opacity="0.10"/>

  <text x="72" y="76" fill="#AAB3C8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2.8">CAPABILITY-GAP SAMPLE</text>
  <text x="72" y="132" fill="#F6F7FB" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="750">Measured strengths &amp; friction</text>

  <rect x="72" y="166" width="1056" height="112" rx="20" fill="#151C30" stroke="#29324B"/>
  <text x="102" y="204" fill="#929DB6" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">STRONGEST MEASURED CATEGORY</text>
  <text x="102" y="250" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="750">Coding</text>
  <rect x="860" y="193" width="230" height="56" rx="28" fill="#2A2458"/>
  <circle cx="894" cy="221" r="7" fill="#9A8CFF"/>
  <text x="916" y="229" fill="#D9D4FF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Developing</text>

  <text x="72" y="324" fill="#929DB6" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">CATEGORY RESULTS</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="72" y="346" width="336" height="82" rx="16" fill="#151C30"/>
    <text x="96" y="378" fill="#F2F4FA" font-size="18" font-weight="650">Research verification</text>
    <text x="96" y="408" fill="#FFB45E" font-size="17" font-weight="750">WEAK</text>

    <rect x="432" y="346" width="336" height="82" rx="16" fill="#151C30"/>
    <text x="456" y="378" fill="#F2F4FA" font-size="18" font-weight="650">Visual design</text>
    <text x="456" y="408" fill="#FF6B7A" font-size="17" font-weight="750">CRITICAL</text>

    <rect x="792" y="346" width="336" height="82" rx="16" fill="#151C30"/>
    <text x="816" y="378" fill="#F2F4FA" font-size="18" font-weight="650">Coding</text>
    <text x="816" y="408" fill="#9A8CFF" font-size="17" font-weight="750">DEVELOPING</text>

    <rect x="72" y="446" width="336" height="82" rx="16" fill="#11182A" stroke="#242D44"/>
    <text x="96" y="478" fill="#DCE1EC" font-size="18" font-weight="650">Spreadsheet work</text>
    <text x="96" y="508" fill="#77829B" font-size="17" font-weight="750">NOT MEASURED</text>

    <rect x="432" y="446" width="336" height="82" rx="16" fill="#11182A" stroke="#242D44"/>
    <text x="456" y="478" fill="#DCE1EC" font-size="18" font-weight="650">Writing</text>
    <text x="456" y="508" fill="#77829B" font-size="17" font-weight="750">NOT MEASURED</text>

    <rect x="792" y="446" width="336" height="82" rx="16" fill="#11182A" stroke="#242D44"/>
    <text x="816" y="478" fill="#DCE1EC" font-size="18" font-weight="650">Tool execution</text>
    <text x="816" y="508" fill="#77829B" font-size="17" font-weight="750">NOT MEASURED</text>
  </g>

  <line x1="72" y1="565" x2="1128" y2="565" stroke="#29324B"/>
  <text x="72" y="598" fill="#AAB3C8" font-family="Inter, Arial, sans-serif" font-size="17">Key friction: brand-consistent visual execution</text>
  <text x="1128" y="598" fill="#68738C" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="end">Sample-based assessment</text>
