<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Agent capability-gap sample results</title>
  <desc id="desc">A generic summary card showing category ratings, the strongest measured category, and a surprising weakness.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101626"/>
      <stop offset="1" stop-color="#080b12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1078" cy="-22" r="260" fill="#6947ff" opacity="0.13"/>
  <circle cx="1120" cy="650" r="230" fill="#ff506e" opacity="0.09"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
    <text x="66" y="64" fill="#9aa6be" font-size="18" font-weight="700" letter-spacing="2.5">CAPABILITY-GAP SAMPLE</text>
    <text x="66" y="119" fill="#f5f7fb" font-size="42" font-weight="760">Measured signal, not model intelligence</text>
    <text x="66" y="153" fill="#aeb7c8" font-size="18">12 entries · explicit friction required for weakness · n &lt; 2 is not measured</text>

    <g filter="url(#shadow)">
      <rect x="66" y="190" width="508" height="122" rx="18" fill="#151d2d" stroke="#263147"/>
      <text x="92" y="225" fill="#8290a8" font-size="15" font-weight="700" letter-spacing="1.5">STRONGEST MEASURED</text>
      <text x="92" y="272" fill="#f5f7fb" font-size="34" font-weight="750">Coding</text>
      <rect x="404" y="238" width="136" height="38" rx="19" fill="#173d32"/>
      <text x="472" y="263" text-anchor="middle" fill="#72e0b4" font-size="16" font-weight="750">COVERED</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="596" y="190" width="538" height="122" rx="18" fill="#151d2d" stroke="#263147"/>
      <text x="622" y="225" fill="#8290a8" font-size="15" font-weight="700" letter-spacing="1.5">SURPRISING WEAKNESS</text>
      <text x="622" y="272" fill="#f5f7fb" font-size="31" font-weight="750">Research verification</text>
      <rect x="989" y="238" width="111" height="38" rx="19" fill="#4a3021"/>
      <text x="1044.5" y="263" text-anchor="middle" fill="#ffbc76" font-size="16" font-weight="750">WEAK</text>
    </g>

    <text x="66" y="358" fill="#9aa6be" font-size="15" font-weight="700" letter-spacing="1.5">CATEGORY RESULTS</text>

    <g font-size="18" font-weight="650">
      <g transform="translate(66 382)">
        <rect width="344" height="64" rx="14" fill="#151d2d" stroke="#263147"/>
        <text x="20" y="39" fill="#e8ecf4">Visual design</text>
        <rect x="224" y="15" width="100" height="34" rx="17" fill="#4b2130"/>
        <text x="274" y="38" text-anchor="middle" fill="#ff829b" font-size="14">CRITICAL</text>
      </g>
      <g transform="translate(428 382)">
        <rect width="344" height="64" rx="14" fill="#151d2d" stroke="#263147"/>
        <text x="20" y="39" fill="#e8ecf4">Tool execution</text>
        <rect x="218" y="15" width="106" height="34" rx="17" fill="#292a55"/>
        <text x="271" y="38" text-anchor="middle" fill="#b9b6ff" font-size="14">DEVELOPING</text>
      </g>
      <g transform="translate(790 382)">
        <rect width="344" height="64" rx="14" fill="#151d2d" stroke="#263147"/>
        <text x="20" y="39" fill="#e8ecf4">Spreadsheet work</text>
        <rect x="207" y="15" width="117" height="34" rx="17" fill="#29303e"/>
        <text x="265.5" y="38" text-anchor="middle" fill="#aeb7c8" font-size="13">NOT MEASURED</text>
      </g>
      <g transform="translate(66 464)">
        <rect width="344" height="64" rx="14" fill="#151d2d" stroke="#263147"/>
        <text x="20" y="39" fill="#e8ecf4">Research verification</text>
        <rect x="239" y="15" width="85" height="34" rx="17" fill="#4a3021"/>
        <text x="281.5" y="38" text-anchor="middle" fill="#ffbc76" font-size="14">WEAK</text>
      </g>
      <g transform="translate(428 464)">
        <rect width="344" height="64" rx="14" fill="#151d2d" stroke="#263147"/>
        <text x="20" y="39" fill="#e8ecf4">Coding</text>
        <rect x="224" y="15" width="100" height="34" rx="17" fill="#173d32"/>
        <text x="274" y="38" text-anchor="middle" fill="#72e0b4" font-size="14">COVERED</text>
      </g>
      <g transform="translate(790 464)">
        <rect width="344" height="64" rx="14" fill="#151d2d" stroke="#263147"/>
        <text x="20" y="39" fill="#e8ecf4">Writing</text>
        <rect x="207" y="15" width="117" height="34" rx="17" fill="#29303e"/>
        <text x="265.5" y="38" text-anchor="middle" fill="#aeb7c8" font-size="13">NOT MEASURED</text>
      </g>
    </g>

    <line x1="66" y1="565" x2="1134" y2="565" stroke="#263147"/>
    <text x="66" y="598" fill="#8290a8" font-size="15">Results describe the supplied sample only.</text>
    <text x="1134" y="598" text-anchor="end" fill="#8290a8" font-size="15">Privacy-scrubbed · evidence-gated</text>
  </g>
</svg>
