<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10131a"/><stop offset="1" stop-color="#18243b"/></linearGradient>
    <style>text{font-family:Arial,sans-serif;fill:#f7f9fc}.eyebrow{font-size:18px;font-weight:700;letter-spacing:2px;fill:#91a9d6}.title{font-size:43px;font-weight:750;letter-spacing:-1px}.label{font-size:22px;font-weight:600}.rating{font:700 18px monospace}.meta{font-size:17px;fill:#aebbd0}</style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="64" y="62" class="eyebrow">AGENT CAPABILITY-GAP SAMPLE</text>
  <text x="64" y="122" class="title">Strongest measured category: Coding</text>
  <line x1="64" y1="155" x2="1136" y2="155" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="64" y="210" class="label">Research verification</text><text x="700" y="210" text-anchor="end" class="rating" fill="#ffad66">WEAK</text>
  <text x="64" y="260" class="label">Spreadsheet work</text><text x="700" y="260" text-anchor="end" class="rating" fill="#94a0b5">NOT MEASURED</text>
  <text x="64" y="310" class="label">Visual design</text><text x="700" y="310" text-anchor="end" class="rating" fill="#ff716b">CRITICAL</text>
  <text x="64" y="360" class="label">Coding</text><text x="700" y="360" text-anchor="end" class="rating" fill="#65dda0">COVERED</text>
  <text x="64" y="410" class="label">Writing</text><text x="700" y="410" text-anchor="end" class="rating" fill="#94a0b5">NOT MEASURED</text>
  <text x="64" y="460" class="label">Tool execution</text><text x="700" y="460" text-anchor="end" class="rating" fill="#94a0b5">NOT MEASURED</text>
  <line x1="780" y1="180" x2="780" y2="510" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="840" y="230" class="eyebrow">SAMPLE RESULT</text>
  <text x="840" y="300" class="title" style="font-size:72px">12</text><text x="840" y="330" class="meta">entries analyzed</text>
  <text x="840" y="410" class="title" style="font-size:72px">6</text><text x="840" y="440" class="meta">relevant skills recommended</text>
  <text x="64" y="570" class="meta">Surprising weakness: visual design showed explicit friction in 3 of 4 relevant entries.</text>
</svg>
