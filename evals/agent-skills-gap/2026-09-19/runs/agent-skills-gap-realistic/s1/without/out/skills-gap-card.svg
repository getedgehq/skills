<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Agent capability-gap sample results</title>
  <desc id="desc">Coding is the strongest measured category. Visual design is critical, research verification is weak, coding and tool execution are developing, and spreadsheet work and writing are not measured.</desc>
  <rect width="1200" height="630" fill="#0b0d10"/>
  <rect x="48" y="48" width="1104" height="534" rx="30" fill="#11151a" stroke="#29313a" stroke-width="2"/>
  <text x="88" y="103" fill="#8d99a6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2.2">CAPABILITY-GAP SAMPLE</text>
  <text x="88" y="163" fill="#f4f7f9" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="750">Strongest measured: Coding</text>
  <text x="88" y="202" fill="#aab4be" font-family="Inter, Arial, sans-serif" font-size="21">Evidence-weighted ratings · low-volume categories remain unmeasured</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="88" y="244" width="500" height="70" rx="16" fill="#171c22"/>
    <circle cx="119" cy="279" r="8" fill="#f25f5c"/>
    <text x="141" y="286" fill="#eef2f5" font-size="22" font-weight="650">Visual design</text>
    <text x="552" y="286" fill="#f25f5c" font-size="18" font-weight="750" text-anchor="end">CRITICAL</text>

    <rect x="612" y="244" width="500" height="70" rx="16" fill="#171c22"/>
    <circle cx="643" cy="279" r="8" fill="#f3ae4b"/>
    <text x="665" y="286" fill="#eef2f5" font-size="22" font-weight="650">Research verification</text>
    <text x="1076" y="286" fill="#f3ae4b" font-size="18" font-weight="750" text-anchor="end">WEAK</text>

    <rect x="88" y="334" width="500" height="70" rx="16" fill="#171c22"/>
    <circle cx="119" cy="369" r="8" fill="#58a6ff"/>
    <text x="141" y="376" fill="#eef2f5" font-size="22" font-weight="650">Coding</text>
    <text x="552" y="376" fill="#58a6ff" font-size="18" font-weight="750" text-anchor="end">DEVELOPING</text>

    <rect x="612" y="334" width="500" height="70" rx="16" fill="#171c22"/>
    <circle cx="643" cy="369" r="8" fill="#58a6ff"/>
    <text x="665" y="376" fill="#eef2f5" font-size="22" font-weight="650">Tool execution</text>
    <text x="1076" y="376" fill="#58a6ff" font-size="18" font-weight="750" text-anchor="end">DEVELOPING</text>

    <rect x="88" y="424" width="500" height="70" rx="16" fill="#171c22"/>
    <circle cx="119" cy="459" r="8" fill="#66717d"/>
    <text x="141" y="466" fill="#eef2f5" font-size="22" font-weight="650">Spreadsheet work</text>
    <text x="552" y="466" fill="#8d99a6" font-size="18" font-weight="750" text-anchor="end">NOT MEASURED</text>

    <rect x="612" y="424" width="500" height="70" rx="16" fill="#171c22"/>
    <circle cx="643" cy="459" r="8" fill="#66717d"/>
    <text x="665" y="466" fill="#eef2f5" font-size="22" font-weight="650">Writing</text>
    <text x="1076" y="466" fill="#8d99a6" font-size="18" font-weight="750" text-anchor="end">NOT MEASURED</text>
  </g>

  <line x1="88" y1="528" x2="1112" y2="528" stroke="#29313a" stroke-width="2"/>
  <text x="88" y="557" fill="#8d99a6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">RATINGS DESCRIBE THE SUPPLIED SAMPLE</text>
</svg>
