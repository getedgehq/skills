<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Capability gap snapshot</title>
  <desc id="desc">A sample-limited category assessment showing writing covered, spreadsheet work critical, tool execution developing, and three categories not measured.</desc>
  <rect width="1200" height="630" fill="#0E1116"/>
  <rect x="52" y="46" width="1096" height="538" rx="28" fill="#151A22" stroke="#2B3442" stroke-width="2"/>
  <text x="92" y="112" fill="#F4F1E8" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Capability gap snapshot</text>
  <text x="92" y="149" fill="#98A4B5" font-family="Inter, Arial, sans-serif" font-size="19">Evidence-based • sample-limited • minimum two entries per measured category</text>

  <rect x="92" y="185" width="1016" height="82" rx="18" fill="#1C2430"/>
  <text x="118" y="218" fill="#93A4BA" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="1.4">STRONGEST MEASURED CATEGORY</text>
  <text x="118" y="251" fill="#F4F1E8" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Writing</text>
  <rect x="944" y="205" width="136" height="40" rx="20" fill="#244E3C"/>
  <text x="1012" y="231" text-anchor="middle" fill="#9EE5BF" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">COVERED</text>

  <text x="92" y="313" fill="#F4F1E8" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Category results</text>

  <g font-family="Inter, Arial, sans-serif" font-size="17">
    <text x="100" y="357" fill="#CBD3DE">Research verification</text>
    <text x="100" y="407" fill="#CBD3DE">Spreadsheet work</text>
    <text x="100" y="457" fill="#CBD3DE">Visual design</text>
    <text x="605" y="357" fill="#CBD3DE">Coding</text>
    <text x="605" y="407" fill="#CBD3DE">Writing</text>
    <text x="605" y="457" fill="#CBD3DE">Tool execution</text>

    <rect x="351" y="331" width="166" height="36" rx="18" fill="#29313D"/>
    <text x="434" y="355" text-anchor="middle" fill="#AAB4C2" font-weight="700">NOT MEASURED</text>
    <rect x="351" y="381" width="166" height="36" rx="18" fill="#512D32"/>
    <text x="434" y="405" text-anchor="middle" fill="#FFB3B9" font-weight="700">CRITICAL</text>
    <rect x="351" y="431" width="166" height="36" rx="18" fill="#29313D"/>
    <text x="434" y="455" text-anchor="middle" fill="#AAB4C2" font-weight="700">NOT MEASURED</text>

    <rect x="856" y="331" width="166" height="36" rx="18" fill="#29313D"/>
    <text x="939" y="355" text-anchor="middle" fill="#AAB4C2" font-weight="700">NOT MEASURED</text>
    <rect x="856" y="381" width="166" height="36" rx="18" fill="#244E3C"/>
    <text x="939" y="405" text-anchor="middle" fill="#9EE5BF" font-weight="700">COVERED</text>
    <rect x="856" y="431" width="166" height="36" rx="18" fill="#4B4026"/>
    <text x="939" y="455" text-anchor="middle" fill="#F2D58A" font-weight="700">DEVELOPING</text>
  </g>

  <line x1="92" y1="497" x2="1108" y2="497" stroke="#2B3442" stroke-width="2"/>
  <text x="92" y="535" fill="#93A4BA" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="1.2">SURPRISING WEAKNESS</text>
  <text x="92" y="565" fill="#F4F1E8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Spreadsheet verification discipline</text>
  <text x="1108" y="562" text-anchor="end" fill="#98A4B5" font-family="Inter, Arial, sans-serif" font-size="15">Ratings reflect evidence, not task volume alone</text>
</svg>
