<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Capability gap snapshot</title>
  <desc id="desc">A generic summary of category ratings from a nine-entry sample.</desc>
  <rect width="1200" height="630" fill="#10131a"/>
  <circle cx="1068" cy="-6" r="260" fill="#20283a"/>
  <circle cx="1090" cy="22" r="170" fill="#293550"/>
  <rect x="64" y="54" width="168" height="34" rx="17" fill="#273044"/>
  <text x="148" y="77" text-anchor="middle" fill="#aebbd4" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">SAMPLE SNAPSHOT</text>
  <text x="64" y="142" fill="#f6f7fb" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="750">Capability gap</text>
  <text x="64" y="189" fill="#9da9bf" font-family="Inter, Arial, sans-serif" font-size="22">Measured across six task categories</text>

  <rect x="64" y="232" width="508" height="112" rx="20" fill="#171c26" stroke="#2a3345"/>
  <text x="92" y="267" fill="#8996ac" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">STRONGEST MEASURED</text>
  <text x="92" y="316" fill="#f6f7fb" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="750">Writing</text>
  <rect x="421" y="273" width="123" height="40" rx="20" fill="#173d33"/>
  <text x="482.5" y="299" text-anchor="middle" fill="#76e0b5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750">COVERED</text>

  <rect x="596" y="232" width="540" height="112" rx="20" fill="#2a171b" stroke="#563039"/>
  <text x="624" y="267" fill="#d397a3" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">CLEAREST GAP</text>
  <text x="624" y="316" fill="#f6f7fb" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="750">Spreadsheet reliability</text>
  <rect x="988" y="273" width="120" height="40" rx="20" fill="#54222b"/>
  <text x="1048" y="299" text-anchor="middle" fill="#ff9aaa" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750">CRITICAL</text>

  <text x="64" y="402" fill="#8996ac" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">CATEGORY RESULTS</text>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(64 430)">
      <rect width="252" height="70" rx="14" fill="#171c26"/>
      <text x="20" y="29" fill="#e7eaf1" font-size="17" font-weight="650">Research verification</text>
      <text x="20" y="53" fill="#77849a" font-size="14" font-weight="700">NOT MEASURED</text>
    </g>
    <g transform="translate(328 430)">
      <rect width="252" height="70" rx="14" fill="#2a171b"/>
      <text x="20" y="29" fill="#e7eaf1" font-size="17" font-weight="650">Spreadsheet work</text>
      <text x="20" y="53" fill="#ff91a3" font-size="14" font-weight="700">CRITICAL</text>
    </g>
    <g transform="translate(592 430)">
      <rect width="252" height="70" rx="14" fill="#171c26"/>
      <text x="20" y="29" fill="#e7eaf1" font-size="17" font-weight="650">Visual design</text>
      <text x="20" y="53" fill="#77849a" font-size="14" font-weight="700">NOT MEASURED</text>
    </g>
    <g transform="translate(856 430)">
      <rect width="280" height="70" rx="14" fill="#171c26"/>
      <text x="20" y="29" fill="#e7eaf1" font-size="17" font-weight="650">Coding</text>
      <text x="20" y="53" fill="#77849a" font-size="14" font-weight="700">NOT MEASURED</text>
    </g>
    <g transform="translate(64 512)">
      <rect width="516" height="70" rx="14" fill="#162620"/>
      <text x="20" y="29" fill="#e7eaf1" font-size="17" font-weight="650">Writing</text>
      <text x="20" y="53" fill="#76e0b5" font-size="14" font-weight="700">COVERED</text>
    </g>
    <g transform="translate(592 512)">
      <rect width="544" height="70" rx="14" fill="#2a171b"/>
      <text x="20" y="29" fill="#e7eaf1" font-size="17" font-weight="650">Tool execution</text>
      <text x="20" y="53" fill="#ff91a3" font-size="14" font-weight="700">CRITICAL</text>
    </g>
  </g>
  <text x="64" y="612" fill="#66738a" font-family="Inter, Arial, sans-serif" font-size="14">Ratings reflect observed evidence in the supplied sample.</text>
</svg>
