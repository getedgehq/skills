<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Agent capability gap sample results</title>
  <desc id="desc">Research verification is developing. Writing is weak. Tool execution is critical. Spreadsheet work, visual design, and coding are not measured.</desc>
  <rect width="1200" height="630" fill="#0B1020"/>
  <circle cx="1110" cy="70" r="190" fill="#25315F" opacity="0.35"/>
  <circle cx="80" cy="610" r="210" fill="#153F42" opacity="0.32"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="76" fill="#91A4C8" font-size="20" font-weight="700" letter-spacing="3">CAPABILITY GAP · SAMPLE RESULTS</text>
    <text x="72" y="134" fill="#F7F9FF" font-size="42" font-weight="750">Where the evidence points</text>
    <text x="72" y="171" fill="#AAB6D0" font-size="19">Explicit friction drives gap ratings · fewer than 2 entries = not measured</text>

    <rect x="72" y="214" width="1056" height="104" rx="20" fill="#151D35" stroke="#34436B"/>
    <text x="100" y="249" fill="#91A4C8" font-size="16" font-weight="700" letter-spacing="2">STRONGEST MEASURED CATEGORY</text>
    <text x="100" y="292" fill="#F7F9FF" font-size="30" font-weight="720">Research verification</text>
    <rect x="884" y="239" width="210" height="54" rx="27" fill="#153F42"/>
    <text x="989" y="274" fill="#72E2C4" font-size="20" font-weight="750" text-anchor="middle">DEVELOPING</text>

    <g transform="translate(72 350)">
      <rect width="336" height="92" rx="16" fill="#151D35"/>
      <text x="20" y="35" fill="#CBD5E8" font-size="18" font-weight="650">Spreadsheet work</text>
      <text x="20" y="67" fill="#7F8CAA" font-size="16" font-weight="700">NOT MEASURED</text>
    </g>
    <g transform="translate(432 350)">
      <rect width="336" height="92" rx="16" fill="#151D35"/>
      <text x="20" y="35" fill="#CBD5E8" font-size="18" font-weight="650">Visual design</text>
      <text x="20" y="67" fill="#7F8CAA" font-size="16" font-weight="700">NOT MEASURED</text>
    </g>
    <g transform="translate(792 350)">
      <rect width="336" height="92" rx="16" fill="#151D35"/>
      <text x="20" y="35" fill="#CBD5E8" font-size="18" font-weight="650">Coding</text>
      <text x="20" y="67" fill="#7F8CAA" font-size="16" font-weight="700">NOT MEASURED</text>
    </g>
    <g transform="translate(72 466)">
      <rect width="510" height="96" rx="16" fill="#2D2521" stroke="#624535"/>
      <text x="24" y="38" fill="#F5D2B8" font-size="20" font-weight="650">Writing</text>
      <text x="486" y="38" fill="#F2A66F" font-size="17" font-weight="800" text-anchor="end">WEAK</text>
      <text x="24" y="70" fill="#C7A894" font-size="15">Explicit tone and generic-copy friction</text>
    </g>
    <g transform="translate(606 466)">
      <rect width="522" height="96" rx="16" fill="#352029" stroke="#763746"/>
      <text x="24" y="38" fill="#FFD7DD" font-size="20" font-weight="650">Tool execution</text>
      <text x="498" y="38" fill="#FF8496" font-size="17" font-weight="800" text-anchor="end">CRITICAL</text>
      <text x="24" y="70" fill="#D9AAB2" font-size="15">Timeouts, permission, and tool errors</text>
    </g>
    <text x="72" y="604" fill="#74819F" font-size="14">Sample-specific assessment · volume alone does not indicate capability</text>
  </g>
</svg>
