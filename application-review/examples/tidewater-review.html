<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Tidewater: YC application, for review</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@1,8..60,500&display=swap">
<style>
/* Application-portal look: cream canvas, side section nav, answers in white boxes, sticky footer bar. */
:root{--canvas:#f5f5ee;--box:#fff;--ink:#16181d;--muted:#7d7d77;--line:#c9c9c2;--soft:#ebebe3;--accent:#f26625;--sent:#e7f3ec;--sentink:#1d6b3f;--old:#efefe8;
  --sans:Outfit,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--serif:"Source Serif 4",Georgia,"Times New Roman",serif}
body.speedrun{--canvas:#f4f4f1;--accent:#16181d}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:20px}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.mark{position:absolute;top:10px;left:max(16px,env(safe-area-inset-left,0px));min-width:40px;height:40px;padding:0 8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:500}
.layout{display:grid;grid-template-columns:200px minmax(0,640px);gap:56px;justify-content:center;padding-top:96px}
nav{position:sticky;top:30vh;align-self:start;display:flex;flex-direction:column;gap:8px;font-size:15px}
nav a{color:var(--muted);text-decoration:none}nav a:hover,nav a.on{color:var(--ink)}
h1{font-family:var(--serif);font-style:italic;font-weight:500;font-size:46px;line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
body.speedrun h1{font-family:var(--sans);font-style:normal;font-weight:600;font-size:40px}
.sub{color:var(--muted);margin:0 0 22px}
.hello,.vline{background:var(--box);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin:0 0 10px}
.hello p{margin:0}.hello .how{color:var(--muted);font-size:14px;margin-top:4px}
.vline{border-color:var(--accent);font-size:14.5px}.vline a,.hello a{color:var(--ink)}
.vline.old{border-color:var(--line);background:var(--old)}
h2{font-size:23px;font-weight:500;margin:46px 0 16px}
.qa{margin:0 0 24px;position:relative}
.ql{display:flex;gap:10px;align-items:flex-start}
.ql label{font-weight:500;display:block;flex:1}
.nt{flex:none;background:none;border:1px solid transparent;border-radius:6px;color:var(--muted);padding:3px 6px;cursor:pointer;opacity:.6;line-height:0;min-width:32px;min-height:28px}
.qa:hover .nt,.nt:focus-visible,.nt.on{opacity:1;border-color:var(--line);color:var(--ink)}
.box{background:var(--box);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-top:8px;overflow-wrap:anywhere}
.box p{margin:0 0 8px}.box p:last-child{margin:0}.box ul{margin:0 0 8px;padding-left:20px}
details summary{cursor:pointer;color:var(--muted);font-size:14px;margin-top:6px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ "}details[open] summary::before{content:"\2212  "}
.full{margin-top:8px;border-top:1px solid var(--soft);padding-top:8px}
.notes{display:flex;flex-direction:column;gap:6px;margin-top:8px}.notes:empty{display:none}
.note{background:var(--sent);color:var(--sentink);border-radius:6px;padding:6px 10px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.note .st{display:block;font-size:12.5px;opacity:.85;margin-top:2px}
.note.prev{background:var(--old);color:var(--muted)}
.nr{margin-top:8px}.nr textarea{width:100%;min-height:44px;font:inherit;padding:9px 12px;border:1px solid var(--ink);border-radius:4px;background:var(--box);color:var(--ink);resize:vertical}
.nr .row{display:flex;gap:8px;align-items:center;margin-top:6px}.nr .hint{color:var(--muted);font-size:13px;flex:1}
.err{color:#b42318;font-size:13px}
.btn{font-family:var(--serif);font-style:italic;font-size:15px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
.btn.out{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--soft);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:70vh;overflow:auto}
.bar .in,.gen{max-width:640px;margin:0 auto;transform:translateX(128px)}
.bar .in{display:flex;gap:12px;align-items:center}
.cnt{font-family:var(--serif);font-style:italic;color:var(--muted)}
.bar .btn{margin-left:auto}
.gen{margin-top:10px}.gen textarea{width:100%;min-height:70px;font:inherit;padding:9px 12px;border:1px solid var(--ink);border-radius:4px}
.gen .notes{margin-bottom:8px}
.gone{max-width:520px;margin:20vh auto;text-align:center;color:var(--muted)}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,640px);padding-top:72px}nav{display:none}.bar .in,.gen{transform:none}h1{font-size:34px!important}}
</style><style>
[hidden]{display:none!important}
.modal{position:fixed;inset:0;background:rgba(22,24,29,.45);display:grid;place-items:center;padding:16px;z-index:10}
.sheet{background:#fff;border-radius:10px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:18px}
.sheet h3{margin:0 0 6px;font-size:19px;font-weight:600}.sheet p{margin:0 0 10px;color:var(--muted);font-size:14px}
.sheet input{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px;margin:0 0 10px}
.sheet textarea{width:100%;min-height:220px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;padding:10px;border:1px solid var(--line);border-radius:6px;background:#fafaf7}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.sheet a.btn{text-decoration:none;display:inline-block}
.note .x{background:none;border:0;color:inherit;opacity:.7;cursor:pointer;font:inherit;font-size:12.5px;padding:0 0 0 6px;text-decoration:underline}
.bar .in{flex-wrap:wrap}
@media (max-width:520px){.bar .in .btn{padding:9px 13px;font-size:14px}}
</style></head>
<body>
<div class="mark" aria-hidden="true" id="mark"></div>
<div class="layout" id="layout">
<nav aria-label="Sections" id="nav"></nav>
<main>
<h1 id="h1"></h1>
<p class="sub" id="sub"></p>
<div class="hello"><p id="hi"></p>
<p class="how"><span id="howt">Note on any answer: click the speech bubble (or hover and press C). Enter saves, Shift+Enter is a new line.</span> Notes stay in this browser until you press <b>Send my notes</b>.</p></div>
<div id="body"></div>
</main></div>
<div class="bar" id="bar"><div class="in"><span class="cnt" id="cnt" aria-live="polite">No notes yet</span><button type="button" class="btn out" id="genb">General note</button><button type="button" class="btn" id="sendb">Send my notes</button></div>
<div class="gen" id="gen" hidden><div class="notes" id="gennotes"></div><textarea id="gent" maxlength="4000" placeholder="Anything overall. Cmd+Enter saves." aria-label="General note"></textarea></div></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mt"><div class="sheet">
<h3 id="mt"></h3><p id="mp"></p>
<input id="rname" placeholder="Your name" aria-label="Your name" autocomplete="name">
<textarea id="out" readonly aria-label="Your notes as text"></textarea>
<div class="row"><button type="button" class="btn" id="copyb">Copy notes</button><a class="btn out" id="mailb" hidden>Email them</a><button type="button" class="btn out" id="closeb">Close</button></div>
<p id="mailhint" style="margin-top:8px"></p>
</div></div>
<script type="application/json" id="data">{"program": "yc", "program_label": "YC", "company": "Tidewater", "founder_name": "Maya Chen", "founder_email": "maya@tidewater.example", "items": [{"qid": "describe-what-your-company-does-in-50-characters", "q": "Describe what your company does in 50 characters or less.", "a": "Predicts berth delays at container terminals", "sec": "COMPANY"}, {"qid": "what-is-your-company-going-to-make-please-descri", "q": "What is your company going to make? Please describe your product and what it does or will do.", "a": "Tidewater predicts berth delays at container terminals 72 hours ahead, using ship positions (AIS), weather and crane schedules. The forecast is live at 2 terminals in Rotterdam.\n\nToday planners rebuild the berth plan by hand every shift. Next we will re-plan the schedule automatically when a delay is predicted.", "sec": "COMPANY", "tl": "Berth-delay forecasts 72 h ahead, live at 2 terminals in Rotterdam."}, {"qid": "how-far-along-are-you", "q": "How far along are you?", "a": "14 planners use Tidewater every shift (daily actives) at 2 terminals in Rotterdam. The delay forecast is live; automatic re-planning is next. First paid pilot signed in October at EUR 4k/month.", "sec": "PROGRESS", "tl": "14 daily active planners at 2 terminals, first paid pilot EUR 4k/month."}, {"qid": "why-did-you-pick-this-idea-to-work-on", "q": "Why did you pick this idea to work on?", "a": "Maya ran berth planning at a terminal for 5 years and watched every plan break by noon. Leo spent 4 years as a backend engineer at a freight-tracking startup.", "sec": "IDEA", "tl": "Maya ran berth planning for 5 years; Leo built freight tracking for 4."}], "draft_id": "2ef26003"}</script>
<script>
(function(){
  var D=JSON.parse(document.getElementById("data").textContent), KEY="app-review-notes-"+D.draft_id, NKEY="app-review-name";
  function $(id){return document.getElementById(id)}
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return MEM}}
  var MEM=[], storeOk=true;
  function save(a){MEM=a;try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){storeOk=false}}
  var notes=load(); MEM=notes;
  function fmt(a,box){a.split(/\n\n+/).forEach(function(b){var ls=b.split("\n");if(ls.every(function(l){return /^[-*] /.test(l)})){var ul=el("ul");ls.forEach(function(l){ul.appendChild(el("li",null,l.slice(2)))});box.appendChild(ul)}else{var p=el("p");ls.forEach(function(l,i){if(i)p.appendChild(el("br"));p.appendChild(document.createTextNode(l))});box.appendChild(p)}})}
  function when(t){try{return new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}catch(e){return ""}}
  var founder=(D.founder_name||"").split(/\s+/)[0]||"the founder";
  function count(){var n=notes.length;$("cnt").textContent=n?(n+(n===1?" note":" notes")+" saved ✓"):"No notes yet"}
  function noteEl(n){var d=el("div","note",n.body),st=el("span","st","Saved ✓ · "+when(n.at)),x=el("button","x","Delete");x.type="button";
    x.onclick=function(){if(!x.dataset.sure){x.dataset.sure=1;x.textContent="Delete for good?";return}notes=notes.filter(function(m){return m.id!==n.id});save(notes);d.remove();count()};st.appendChild(x);d.appendChild(st);return d}
  function add(qid,body){var n={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),qid:qid,body:body,at:new Date().toISOString()};notes.push(n);save(notes);count();return n}
  document.body.className=D.program;
  $("mark").textContent=D.program==="yc"?"Y":"SR";
  $("h1").textContent=D.program==="yc"?"YC Application":"Speedrun Application";
  $("sub").textContent=[D.program_label,D.company,"draft for review"].filter(Boolean).join(" · ");
  $("hi").textContent="Thanks for reviewing"+(D.founder_name?" for "+founder:"")+". Long answers are cut to one line; open the full text where you want depth.";
  if(window.matchMedia&&matchMedia("(hover: none)").matches)$("howt").textContent="Tap the speech bubble on any answer to leave a note.";
  var nav=$("nav"),body=$("body"),secs=[],cur=null,hov=null;
  D.items.forEach(function(it,i){it.n=i+1;var s=it.sec||"";if(s!==cur){cur=s;secs.push({name:s,items:[]})}secs[secs.length-1].items.push(it)});
  secs.forEach(function(s,si){
    if(s.name){var id="s-"+si,h=el("h2",null,s.name.charAt(0)+s.name.slice(1).toLowerCase());h.id=id;body.appendChild(h);var a=el("a",null,h.textContent);a.href="#"+id;nav.appendChild(a)}
    s.items.forEach(function(it){
      var sec=el("section","qa");sec.dataset.qid=it.qid;
      var ql=el("div","ql"),lab=el("label",null,it.q),nt=el("button","nt");nt.type="button";nt.setAttribute("aria-label","Note on this answer");nt.title="Note (or hover and press C)";
      nt.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
      ql.appendChild(lab);ql.appendChild(nt);sec.appendChild(ql);
      var box=el("div","box");
      if(it.tl){box.appendChild(el("p",null,it.tl));var det=el("details"),sm=el("summary",null,"Full answer"),full=el("div","full");fmt(it.a,full);det.appendChild(sm);det.appendChild(full);box.appendChild(det)}
      else fmt(it.a||"(no answer yet)",box);
      sec.appendChild(box);
      var ns=el("div","notes");notes.filter(function(n){return n.qid===it.qid}).forEach(function(n){ns.appendChild(noteEl(n))});sec.appendChild(ns);
      var nr=el("div","nr");nr.hidden=true;var ta=el("textarea");ta.maxLength=4000;ta.rows=2;ta.placeholder="Note for "+founder;ta.setAttribute("aria-label","Note on: "+it.q);
      var row=el("div","row"),hint=el("span","hint","Enter saves"),sb=el("button","btn out","Save");sb.type="button";row.appendChild(hint);row.appendChild(sb);nr.appendChild(ta);nr.appendChild(row);sec.appendChild(nr);
      function openN(){nr.hidden=false;nt.classList.add("on");ta.focus()} function closeN(){nr.hidden=true;nt.classList.remove("on")}
      sec._open=openN;nt.onclick=function(){nr.hidden?openN():closeN()};
      sec.addEventListener("mouseenter",function(){hov=sec});
      function go(){var v=ta.value.trim();if(!v)return;ns.appendChild(noteEl(add(it.qid,v)));ta.value="";hint.textContent=storeOk?"Saved ✓ Add another, or Esc to close":"Saved for this visit only: your browser blocks storage. Send your notes before closing.";ta.focus()}
      sb.onclick=go;
      ta.addEventListener("keydown",function(e){if(e.key==="Escape"){closeN();return}if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();go()}});
      body.appendChild(sec);
    });
  });
  if(!nav.children.length)nav.style.visibility="hidden";
  notes.filter(function(n){return n.qid==="general"}).forEach(function(n){$("gennotes").appendChild(noteEl(n))});
  count();
  document.addEventListener("keydown",function(e){var t=e.target.tagName;if(t==="INPUT"||t==="TEXTAREA"||e.metaKey||e.ctrlKey||e.altKey)return;if((e.key==="c"||e.key==="C")&&hov){e.preventDefault();hov._open()}});
  var gb=$("genb"),g=$("gen"),gt=$("gent");
  gb.onclick=function(){if(g.hidden){g.hidden=false;gt.focus();gb.textContent="Save"}else if(gt.value.trim()){$("gennotes").appendChild(noteEl(add("general",gt.value.trim())));gt.value="";gt.focus()}else{g.hidden=true;gb.textContent="General note"}};
  gt.addEventListener("keydown",function(e){if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))gb.click()});
  // Plain-text export the founder's agent can parse: one "## Q<n>." block per question, "- " per note, continuation lines indented 2 spaces.
  function text(name){
    var L=["Review notes"+(name?" from "+name:"")+" on "+[D.company,D.program_label+" application"].filter(Boolean).join(" ")+" (draft "+D.draft_id+")",""],any=false;
    function bullets(list){list.forEach(function(n){var ls=n.body.split(/\r?\n/);L.push("- "+ls[0]);ls.slice(1).forEach(function(l){L.push("  "+l)})})}
    D.items.forEach(function(it){var list=notes.filter(function(n){return n.qid===it.qid});if(!list.length)return;any=true;L.push("## Q"+it.n+". "+it.q);bullets(list);L.push("")});
    var gl=notes.filter(function(n){return n.qid==="general"});if(gl.length){any=true;L.push("## General");bullets(gl);L.push("")}
    if(!any)L.push("(no notes yet)");
    return L.join("\n").trim()+"\n";
  }
  var mod=$("modal"),out=$("out"),rn=$("rname"),mb=$("mailb");
  try{rn.value=localStorage.getItem(NKEY)||""}catch(e){}
  function refresh(){var t=text(rn.value.trim());out.value=t;
    if(D.founder_email){var subj="Notes on your "+D.program_label+" application",href="mailto:"+encodeURIComponent(D.founder_email)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(t);
      mb.hidden=false;mb.href=href;mb.textContent="Email to "+founder;$("mailhint").textContent=href.length>1800?"Long notes can get cut off in some mail apps. If that happens, copy them instead.":""}}
  $("sendb").onclick=function(){$("mt").textContent="Send your notes to "+founder;$("mp").textContent=notes.length?"Copy them into a message to "+founder+(D.founder_email?", or email them":"")+". "+founder+"'s agent reads them and works through every note.":"You haven't left any notes yet. Tap a speech bubble next to an answer.";refresh();mod.hidden=false;(rn.value?$("copyb"):rn).focus()};
  rn.addEventListener("input",function(){try{localStorage.setItem(NKEY,rn.value.trim())}catch(e){}refresh()});
  $("copyb").onclick=function(){var b=$("copyb");function done(){b.textContent="Copied ✓";setTimeout(function(){b.textContent="Copy notes"},2000)}
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(out.value).then(done,function(){out.select();document.execCommand("copy");done()});else{out.focus();out.select();try{document.execCommand("copy");done()}catch(e){b.textContent="Select all and copy"}}};
  $("closeb").onclick=function(){mod.hidden=true};
  mod.addEventListener("click",function(e){if(e.target===mod)mod.hidden=true});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!mod.hidden)mod.hidden=true});
  var links=null;window.addEventListener("scroll",function(){if(!links)links=[].slice.call(document.querySelectorAll("nav a"));var y=window.scrollY+window.innerHeight*.4,k=0;links.forEach(function(a,i){var h=document.querySelector(a.getAttribute("href"));if(h&&h.offsetTop<=y)k=i});links.forEach(function(a,i){a.classList.toggle("on",i===k)})},{passive:true});
})();
</script>
</body></html>
