<title>{{NAME}} Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap">
<style>
:root{--bg:#fbfbf8;--ink:#111;--dim:#6b6b66;--faint:#b9b9b2;--hi:#154cff;--hi-ink:#fff;--warn:#9a6700;--ok:#1a7f37}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d0d0c;--ink:#ecece6;--dim:#9a9a92;--faint:#4a4a45;--hi:#8aa6ff;--hi-ink:#0d0d0c;--warn:#e3b341;--ok:#56d364}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d0d0c;--ink:#ecece6;--dim:#9a9a92;--faint:#4a4a45;--hi:#8aa6ff;--hi-ink:#0d0d0c;--warn:#e3b341;--ok:#56d364}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.wrap{max-width:980px;margin:0 auto;padding-inline:18px;padding-block:26px 64px;display:flex;flex-direction:column;gap:30px}
pre{margin:0;font:inherit;white-space:pre;overflow-x:auto}
.dim{color:var(--dim)}.faint{color:var(--faint)}.hi{color:var(--hi)}.warn{color:var(--warn)}.ok{color:var(--ok)}
.logo{font-weight:800;font-size:15px}
h2{font:inherit;font-weight:800;margin:0 0 8px}
.flow{color:var(--ink)}
.dec{border:1px dashed var(--faint);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.dec.open{border:1px solid var(--ink)}
.q{font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
button{font:inherit;background:none;border:0;color:var(--ink);padding:0;cursor:pointer}
button:hover{color:var(--hi)}
button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
details summary{cursor:pointer;color:var(--dim);list-style:none;display:inline}
details summary::-webkit-details-marker{display:none}
details[open]{width:100%}
.more{color:var(--dim);margin:6px 0 0;white-space:normal;max-width:72ch}
textarea{width:100%;min-height:56px;margin-top:6px;font:inherit;font-size:13px;background:transparent;color:var(--ink);border:1px dashed var(--faint);padding:6px 8px;resize:vertical}
.line{display:grid;grid-template-columns:11ch minmax(0,1fr) 9ch 8ch;gap:1.5ch;align-items:baseline;padding:2px 0}
.line .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line details{grid-column:1/-1}
.lane{margin-top:4px}
.saved{color:var(--dim);font-size:12px}
@media (max-width:620px){.line{grid-template-columns:11ch minmax(0,1fr)}.line .s,.line .w{display:none}body{font-size:13px}}
</style>

<div class="wrap">
<pre class="logo">{{BANNER}}</pre>

<pre class="flow dim" aria-label="How work moves"> codex builds ──▶ claude reviews ──▶ staging ──▶ <span class="hi">live for users</span>
                         └── you decide ◆ below</pre>

<section aria-labelledby="dh">
  <h2 id="dh">◆ needs your call <span class="dim" id="dcount"></span></h2>
  <div id="decisions" style="display:flex;flex-direction:column;gap:10px"><span class="dim">loading…</span></div>
</section>

<section aria-labelledby="wh">
  <h2 id="wh">▦ work</h2>
  <div id="board"></div>
</section>

<section aria-labelledby="gh">
  <h2 id="gh">✎ anything else</h2>
  <textarea id="general-note" aria-label="Anything else" placeholder="priorities, missing things, things to cut"></textarea>
  <div class="btns" style="margin-top:6px"><button id="general-save" type="button">[ save ]</button><span class="saved" id="general-saved"></span></div>
</section>
</div>

<script>
const LANES=[["now","now"],["next","next"],["later","later"],["done","shipped today"]];
const PROG={done:10,waiting:8,running:5,planned:0,blocked:3};
let db=null, items=[];
const el=(t,a={},...k)=>{const n=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==="class")n.className=v;else if(x==="text")n.textContent=v;else n.setAttribute(x,v)}for(const c of k)if(c)n.append(c);return n};
const bar=s=>{const f=PROG[s]??0;return "▓".repeat(f)+"░".repeat(10-f)};
const cls=s=>({done:"ok",waiting:"warn",running:"hi",planned:"faint",blocked:"warn"}[s]||"faint");

function renderDecisions(){
  const box=document.getElementById("decisions");
  const ds=items.filter(i=>i.kind==="decision").sort((a,b)=>(!!a.decision-!!b.decision)||(a.order-b.order));
  const open=ds.filter(d=>!d.decision).length;
  document.getElementById("dcount").textContent=`(${open} open / ${ds.length})`;
  box.replaceChildren(...ds.map((d,i)=>{
    const c=el("div",{class:"dec"+(d.decision?"":" open")});
    c.append(el("div",{class:"q"},el("span",{class:"dim",text:(d.decision?"✓ ":"◆ ")}),document.createTextNode(d.title)));
    c.append(el("div",{},el("span",{class:"dim",text:"→ suggest: "}),el("span",{class:"hi",text:d.short||d.recommendation||""})));
    const b=el("div",{class:"btns"});
    for(const[v,l]of[["approve","[ approve ]"],["change","[ change ]"],["not_now","[ not now ]"]]){
      const x=el("button",{type:"button","aria-pressed":String(d.decision===v),text:l});x.addEventListener("click",()=>decide(d,v));b.append(x)}
    const det=el("details");det.append(el("summary",{text:d.note?"+ why / note ✓":"+ why / note"}));
    if(d.context)det.append(el("p",{class:"more",text:d.context}));
    if(d.recommendation&&d.short)det.append(el("p",{class:"more",text:"full: "+d.recommendation}));
    const ta=el("textarea",{id:"note-"+d.id,"aria-label":"Note on "+d.title,placeholder:"what to change, or why"});ta.value=d.note||"";
    const s=el("span",{class:"saved"});const sb=el("button",{type:"button",text:"[ save note ]"});sb.addEventListener("click",()=>note(d,ta.value,s));
    det.append(ta,el("div",{class:"btns"},sb,s));b.append(det);c.append(b);return c;
  }));
}

function renderBoard(){
  const b=document.getElementById("board");b.replaceChildren();
  for(const[lane,label]of LANES){
    const list=items.filter(i=>i.kind==="work"&&i.lane===lane).sort((a,c)=>a.order-c.order);
    if(!list.length)continue;
    b.append(el("pre",{class:"lane dim",text:`── ${label} ${"─".repeat(Math.max(4,40-label.length))} ${list.length}`}));
    for(const w of list){
      const row=el("div",{class:"line"});
      row.append(el("span",{class:cls(w.status),text:bar(w.status)}),el("span",{class:"t",text:w.title}),
        el("span",{class:"s "+cls(w.status),text:w.status}),el("span",{class:"w dim",text:(w.owner||"").split(",")[0].toLowerCase()}));
      const det=el("details");det.append(el("summary",{text:w.note?"  + more ✓":"  + more"}));
      if(w.summary)det.append(el("p",{class:"more",text:w.summary}));
      const ta=el("textarea",{id:"wnote-"+w.id,"aria-label":"Note on "+w.title});ta.value=w.note||"";
      const s=el("span",{class:"saved"});const sb=el("button",{type:"button",text:"[ save note ]"});sb.addEventListener("click",()=>note(w,ta.value,s));
      det.append(ta,el("div",{class:"btns"},sb,s));row.append(det);b.append(row);
    }
  }
  b.append(el("pre",{class:"dim",text:"\n ▓ done   ░ to do      "+"legend: done ▓▓▓▓▓▓▓▓▓▓  waiting ▓▓▓▓▓▓▓▓░░  running ▓▓▓▓▓░░░░░"}));
}

async function decide(d,v){if(!db)return;try{await db.collection("items").doc(d.id).update({decision:v,decidedAt:new Date().toISOString()})}catch(e){}}
async function note(it,t,s){if(!db)return;s.textContent="saving…";try{await db.collection("items").doc(it.id).update({note:t.trim(),notedAt:new Date().toISOString()});s.textContent="saved"}catch(e){s.textContent="could not save"}}
document.getElementById("general-save").addEventListener("click",async()=>{const s=document.getElementById("general-saved");if(!db){s.textContent="not available here";return}s.textContent="saving…";try{await db.collection("meta").doc("general").set({note:document.getElementById("general-note").value.trim(),at:new Date().toISOString()});s.textContent="saved"}catch(e){s.textContent="could not save"}});

(async()=>{
  db=await claude.use("db");
  if(!db){document.getElementById("decisions").replaceChildren(el("span",{class:"dim",text:"plan data not available in this view"}));return}
  db.collection("items").onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));renderDecisions();renderBoard()},()=>{});
  db.collection("meta").doc("general").onSnapshot(s=>{const d=s.exists?s.data():null;const ta=document.getElementById("general-note");if(d&&document.activeElement!==ta)ta.value=d.note||""});
})();
</script>
