interface:
  display_name: "Search RocketList"
  short_description: "Find current startup jobs and hiring companies"
  default_prompt: "Use $rocketlist to find high-signal startups that match my criteria and are hiring right now."

dependencies:
  tools:
    - type: "mcp"
      value: "rocketlist"
      description: "RocketList's public job and company search"
      transport: "streamable_http"
      url: "https://rocketlist.ai/mcp"
