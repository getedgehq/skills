name: derivation-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every DERIVATION.json against the bytes next to it
        run: python .github/scripts/derivation_gate.py
